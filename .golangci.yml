version: "2"

formatters:
  enable:
    - gofmt

linters:
  enable:
    - gocritic
    - gocognit
    - gocyclo
    - maintidx
    - dupl
    - mnd
    - unparam
    - ireturn
    - goconst
    - errcheck
  settings:
    goconst:
      min-occurrences: 10
      ignore-tests: true

  exclusions:
    rules:
      - path: _test\.go
        linters:
          - dupl
          - mnd
